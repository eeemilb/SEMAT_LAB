<div id="authScreen">

    <div style="display:flex;justify-content:center">

    <button class="hbtn" id="btnPurchase"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="hide-sm">Закупка</span></button>
    <!-- УДАЛЕНА дублирующая кнопка настроек (шестерёнка) -->
    <button class="hbtn icon-only" id="btnMoreDesktop"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    <button class="hbtn primary" id="btnAdd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="hide-sm">Позиция</span></button>
    <button class="user-chip" id="userChip">

<main>
  <!-- ... остальной HTML без изменений до меню "Ещё" ... -->

  <!-- ЕЩЁ: разбито по секциям -->

  <div class="sheet-title">🖨 Печать</div>
  <button class="sheet-item" data-sheet-action="print-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Ведомость остатков</button>
  <button class="sheet-item" data-sheet-action="print-labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Этикетки со штрих-кодами</button>
  <button class="sheet-item" data-sheet-action="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/></svg>Поделиться списком</button>

  <div class="sheet-title">⚙️ Система</div>

  <button class="sheet-item danger" data-sheet-action="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Выйти из аккаунта</button>

  </div></div>

  <!-- ... остальные модальные окна без изменений ... -->

</div><!-- appRoot -->

<!-- ... скрипты ... -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.7.7/dist/quagga.min.js"></script>
<script>
// ... начало скрипта ...

// === ФИКС: правильная обработка профиля ===
async function loadProfile(user) {
  try {
    const { data, error } = await sb.from('profiles')
      .select('username, display_name, avatar_url')
      .eq('id', user.id)
      .maybeSingle();
    if (error && error.code !== 'PGRST116') throw error;
    if (data) {
      userProfile = data;
    } else {
      // Создаём профиль с данными из метаданных
      const meta = user.user_metadata || {};
      const username = meta.username || user.email.split('@')[0];
      const display_name = meta.display_name || meta.full_name || username;
      const avatar_url = meta.avatar_url || meta.picture || null;
      const { error: insErr } = await sb.from('profiles').insert({
        id: user.id,
        email: user.email,
        username,
        display_name,
        avatar_url
      });
      if (insErr) console.warn('Ошибка создания профиля:', insErr);
      userProfile = { username, display_name, avatar_url };
    }
  } catch (e) {
    console.warn('Ошибка загрузки профиля:', e);
    userProfile = { display_name: user.email };
  }
  updateUserChip();
}

function updateUserChip() {
  const nameEl = document.getElementById('userName');
  const avatarEl = document.getElementById('userAvatar');
  if (!nameEl) return;
  const name = userProfile?.display_name || userProfile?.username || currentUser?.email || '—';
  nameEl.textContent = name;
  if (avatarEl) {
    const url = userProfile?.avatar_url;
    if (url) {
      avatarEl.src = url;
      avatarEl.style.display = 'inline-block';
    } else {
      avatarEl.style.display = 'none';
    }
  }
}

// В onAuthStateChange заменяем блок загрузки профиля:
sb.auth.onAuthStateChange(async function(event, session) {
  if (session && session.user) {
    currentUser = session.user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    await loadProfile(session.user); // <-- вместо старого кода
    await loadAll();
    initRealtime();
    refreshSelects();
    setView('table');
    bindEventsOnce();
    renderAll();
    tryAutoLoadLogo();
  } else {
    currentUser = null;
    userProfile = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
  }
});

// === ФИКС: обработка регистрации с username ===
document.getElementById('authForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName').value.trim();
  const username = document.getElementById('authUsername').value.trim();
  const err = document.getElementById('authError');
  const btn = document.getElementById('authSubmit');
  err.textContent = ''; err.style.color = '#dc2626';
  btn.disabled = true; btn.textContent = 'Подождите...';
  try {
    if (authMode === 'login') {
      const r = await sb.auth.signInWithPassword({ email, password });
      if (r.error) throw r.error;
    } else {
      const meta = { display_name: name || email.split('@')[0] };
      if (username) meta.username = username;
      const r2 = await sb.auth.signUp({
        email, password,
        options: { data: meta }
      });
      if (r2.error) throw r2.error;
      if (r2.data?.user && !r2.data.session) {
        err.style.color = '#059669';
        err.textContent = 'Аккаунт создан. Войдите.';
      }
    }
  } catch (err2) {
    err.style.color = '#dc2626';
    err.textContent = err2.message || String(err2);
  }
  btn.disabled = false;
  btn.textContent = authMode === 'login' ? 'Войти' : 'Создать аккаунт';
});

// === ФИКС: переключение режима auth с полем username ===
function setAuthMode(m) {
  authMode = m;
  document.getElementById('authNameRow').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('authUsernameRow').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('authSubmit').textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabRegister').classList.toggle('active', m === 'register');
}

// === ФИКС: кнопка "Настройки склада" ===
// В обработчике sheetMenu заменяем:
if (act === 'settings') {
  setTimeout(openSettings, 200); // <-- openSettings должна работать
}

// === ФИКС: объединённые импорт/экспорт ===
// В обработчике sheetMenu:
if (act === 'import') {
  openImportModal();
} else if (act === 'export') {
  openExportSheet(); // новая функция
}

// Новая функция для выбора формата экспорта
function openExportSheet() {
  const sheet = document.getElementById('sheetExport');
  if (!sheet) {
    // Создаём динамически
    const div = document.createElement('div');
    div.className = 'sheet';
    div.id = 'sheetExport';
    div.innerHTML = `
      <div class="sheet-bg" data-sheet-close></div>
      <div class="sheet-body">
        <div class="sheet-handle"></div>
        <div class="sheet-title">📤 Экспорт данных</div>
        <button class="sheet-item" data-export="json"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Резервная копия (JSON)</button>
        <button class="sheet-item" data-export="xlsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/></svg>Склад в Excel (XLSX)</button>
        <button class="sheet-item" data-export="dash-xlsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-8"/></svg>Отчёт по проектам (XLSX)</button>
        <button class="sheet-item" data-export="csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Склад в CSV</button>
      </div>`;
    document.body.appendChild(div);
  }
  const el = document.getElementById('sheetExport');
  el.querySelectorAll('[data-export]').forEach(btn => {
    btn.onclick = () => {
      const type = btn.dataset.export;
      closeSheet('#sheetExport');
      setTimeout(() => {
        if (type === 'json') exportJSON();
        else if (type === 'xlsx') exportStockXLSX();
        else if (type === 'dash-xlsx') exportDashboardXLSX();
        else if (type === 'csv') exportCSV();
      }, 200);
    };
  });
  openSheet('#sheetExport');
}

// === ФИКС: удалена дублирующая кнопка настроек ===
// Убедитесь, что в HTML нет кнопки с id="btnSettings" в хедере.
// Кнопка "Настройки склада" в меню "Ещё" теперь работает через openSettings().

// === ФИКС: проверка openSettings ===
// Убедитесь, что функция openSettings определена и не перезаписывается.
// В вашем коде она есть, но проверьте, что модальное окно #modalSettings существует.
// Если кнопка не работала, возможно, был конфликт ID или ошибка в openSettings.
// Теперь она вызывается из меню "Ещё" и должна работать.

</script>
</body>
</html>
